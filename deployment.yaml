apiVersion: v1
kind: Namespace
metadata:
  name: kube-mcp
  labels:
    app.kubernetes.io/name: kube-mcp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-mcp
  namespace: kube-mcp
  labels:
    app.kubernetes.io/name: kube-mcp
---
# RBAC mirrors the application's default resource allowlist. Namespace LIST is
# used only when label-selector namespace policy mode is configured.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-mcp-reader
  labels:
    app.kubernetes.io/name: kube-mcp
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - endpoints
      - configmaps
      - secrets
      - events
      - persistentvolumeclaims
      - replicationcontrollers
      - limitranges
      - resourcequotas
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "backups", "scheduledbackups", "poolers"]
    verbs: ["get", "list"]
  - apiGroups: ["traefik.io"]
    resources:
      - ingressroutes
      - middlewares
      - traefikservices
      - tlsoptions
      - tlsstores
      - serverstransports
      - ingressroutetcps
      - middlewaretcps
      - serverstransporttcps
      - ingressrouteudps
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-mcp-reader
  labels:
    app.kubernetes.io/name: kube-mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-mcp-reader
subjects:
  - kind: ServiceAccount
    name: kube-mcp
    namespace: kube-mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-mcp
  namespace: kube-mcp
  labels:
    app.kubernetes.io/name: kube-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-mcp
    spec:
      serviceAccountName: kube-mcp
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-mcp
          image: ghcr.io/jghh42/kube-mcp:latest
          imagePullPolicy: Always
          env:
            # Set to ApiKey or OAuthClientCredentials and provide the corresponding
            # secret/configuration values for authenticated deployments.
            - name: KubeMcp__Authentication__Mode
              value: None
            - name: KubeMcp__SecretHmacKey
              valueFrom:
                secretKeyRef:
                  name: kube-mcp-hmac
                  key: key
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              httpHeaders:
                - name: Host
                  value: kube-mcp
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: kube-mcp
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: kube-mcp
  namespace: kube-mcp
  labels:
    app.kubernetes.io/name: kube-mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kube-mcp
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
