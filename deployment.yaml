apiVersion: v1
kind: Namespace
metadata:
  name: kube-mcp
  labels:
    app.kubernetes.io/name: kube-mcp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-mcp
  namespace: kube-mcp
  labels:
    app.kubernetes.io/name: kube-mcp
---
# RBAC mirrors the core default resource allowlist in appsettings.json. Only
# built-in Kubernetes resources are granted by default. Optional CloudNativePG
# and Traefik CRDs are deliberately shipped as overlays in overlays/ so that
# unneeded CRDs do not expand the default surface or drift from RBAC. Namespace
# LIST is granted only for label-selector namespace policy mode.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-mcp-reader
  labels:
    app.kubernetes.io/name: kube-mcp
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - endpoints
      - configmaps
      - secrets
      - events
      - persistentvolumeclaims
      - replicationcontrollers
      - limitranges
      - resourcequotas
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-mcp-reader
  labels:
    app.kubernetes.io/name: kube-mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-mcp-reader
subjects:
  - kind: ServiceAccount
    name: kube-mcp
    namespace: kube-mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-mcp
  namespace: kube-mcp
  labels:
    app.kubernetes.io/name: kube-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-mcp
    spec:
      serviceAccountName: kube-mcp
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-mcp
          image: ghcr.io/jghh42/kube-mcp:latest
          imagePullPolicy: Always
          env:
            - name: DOTNET_ENVIRONMENT
              value: Production
            # Reference production deployment: the MCP endpoint is fail-closed.
            # AuthenticationMode.None is rejected outside Development, and the
            # API key is loaded only from a Kubernetes Secret.
            - name: KubeMcp__Authentication__Mode
              value: ApiKey
            - name: KubeMcp__Authentication__ApiKey
              valueFrom:
                secretKeyRef:
                  name: kube-mcp-api-key
                  key: api-key
            - name: KubeMcp__SecretHmacKey
              valueFrom:
                secretKeyRef:
                  name: kube-mcp-hmac
                  key: key
            # Standard ASP.NET Core host filtering remains enabled. Replace
            # k-mcp.example.internal with the internal hostname presented to the
            # application; multiple values are semicolon-separated.
            - name: AllowedHosts
              value: "k-mcp.example.internal;kube-mcp;kube-mcp.kube-mcp;kube-mcp.kube-mcp.svc;kube-mcp.kube-mcp.svc.cluster.local;localhost;127.0.0.1;[::1]"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              httpHeaders:
                - name: Host
                  value: kube-mcp
            initialDelaySeconds: 2
            periodSeconds: 5
            # Process-only probe; Kubernetes access is checked safely per MCP request.
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: kube-mcp
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: kube-mcp
  namespace: kube-mcp
  labels:
    app.kubernetes.io/name: kube-mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kube-mcp
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
