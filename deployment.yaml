apiVersion: v1
kind: Namespace
metadata:
  name: kube-mcp
  labels:
    app.kubernetes.io/name: kube-mcp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-mcp
  namespace: kube-mcp
  labels:
    app.kubernetes.io/name: kube-mcp
---
# Stage 1 intentionally grants broad read access. Later stages add application-level
# resource and namespace restrictions; Kubernetes access remains GET/LIST-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-mcp-reader
  labels:
    app.kubernetes.io/name: kube-mcp
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-mcp-reader
  labels:
    app.kubernetes.io/name: kube-mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-mcp-reader
subjects:
  - kind: ServiceAccount
    name: kube-mcp
    namespace: kube-mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-mcp
  namespace: kube-mcp
  labels:
    app.kubernetes.io/name: kube-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-mcp
    spec:
      serviceAccountName: kube-mcp
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-mcp
          image: kube-mcp:stage2.5
          imagePullPolicy: IfNotPresent
          env:
            - name: KubeMcp__SecretHmacKey
              valueFrom:
                secretKeyRef:
                  name: kube-mcp-hmac
                  key: key
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              httpHeaders:
                - name: Host
                  value: kube-mcp
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: kube-mcp
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: kube-mcp
  namespace: kube-mcp
  labels:
    app.kubernetes.io/name: kube-mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kube-mcp
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
