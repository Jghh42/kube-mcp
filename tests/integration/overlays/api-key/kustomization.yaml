# Active kind harness overlay: keep the production API-key Secret wiring and
# replace only the image settings for the locally loaded candidate.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../deployment.yaml

images:
  - name: ghcr.io/jghh42/kube-mcp:latest
    newName: kube-mcp
    newTag: stage6-test

patches:
  - path: deployment-image-patch.yaml
