# Strategic-merge patch applied to the kube-mcp Deployment by the kind test
# overlay. It is identified by apiVersion/kind/name/namespace so it cannot
# accidentally target any other resource in deployment.yaml.
#
# Strategic merge merges the `env` list by the `name` field, so:
#   - KubeMcp__Authentication__Mode is updated in place from `None` to
#     `OAuthClientCredentials`.
#   - The new OAuth env vars are appended; the existing KubeMcp__SecretHmacKey
#     entry (and its secretKeyRef) is preserved untouched.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-mcp
  namespace: kube-mcp
spec:
  template:
    spec:
      containers:
        - name: kube-mcp
          # The harness always loads the candidate into kind first. Never fall
          # back to a registry image with the same tag.
          imagePullPolicy: Never
          env:
            - name: KubeMcp__Authentication__Mode
              value: OAuthClientCredentials
            - name: KubeMcp__Authentication__OAuth__Authority
              value: http://keycloak.kube-mcp.svc.cluster.local:8080/realms/kube-mcp
            - name: KubeMcp__Authentication__OAuth__Audience
              value: k-mcp
            - name: KubeMcp__Authentication__OAuth__RequiredScopes__0
              value: k-mcp:read
            - name: KubeMcp__Authentication__OAuth__RequiredRoles__0
              value: k-mcp:read
            - name: KubeMcp__Authentication__OAuth__RequireHttpsMetadata
              value: "false"
