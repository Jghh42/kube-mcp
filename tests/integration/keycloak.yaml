apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-mcp-keycloak-realm
  namespace: kube-mcp
data:
  kube-mcp-realm.json: |
    {
      "realm": "kube-mcp",
      "enabled": true,
      "accessTokenLifespan": 300,
      "roles": {
        "realm": [
          { "name": "k-mcp:read" }
        ]
      },
      "clientScopes": [
        {
          "name": "k-mcp:read",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "false"
          },
          "protocolMappers": [
            {
              "name": "realm-roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "consentRequired": false,
              "config": {
                "access.token.claim": "true",
                "claim.name": "realm_access.roles",
                "jsonType.label": "String",
                "multivalued": "true"
              }
            }
          ]
        }
      ],
      "clients": [
        {
          "clientId": "kube-mcp-e2e",
          "secret": "stage-five-e2e-client-secret",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "serviceAccountsEnabled": true,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "defaultClientScopes": ["roles", "k-mcp:read"],
          "protocolMappers": [
            {
              "name": "k-mcp-audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "k-mcp",
                "access.token.claim": "true",
                "id.token.claim": "false"
              }
            }
          ]
        },
        {
          "clientId": "kube-mcp-wrong-audience",
          "secret": "stage-five-wrong-audience-secret",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "serviceAccountsEnabled": true,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "defaultClientScopes": ["roles", "k-mcp:read"]
        },
        {
          "clientId": "kube-mcp-missing-permission",
          "secret": "stage-five-missing-permission-secret",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "serviceAccountsEnabled": true,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "defaultClientScopes": ["roles"],
          "protocolMappers": [
            {
              "name": "k-mcp-audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "k-mcp",
                "access.token.claim": "true",
                "id.token.claim": "false"
              }
            }
          ]
        }
      ],
      "users": [
        {
          "username": "service-account-kube-mcp-e2e",
          "enabled": true,
          "serviceAccountClientId": "kube-mcp-e2e",
          "realmRoles": ["k-mcp:read"]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: kube-mcp
  labels:
    app.kubernetes.io/name: kube-mcp-keycloak
spec:
  replicas: 1
  # This is an ephemeral single-replica integration dependency. Recreate avoids
  # briefly running two memory-heavy Keycloak JVMs on the one-node kind runner.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-mcp-keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-mcp-keycloak
    spec:
      containers:
        - name: keycloak
          # Multi-arch index digest verified from Quay for Keycloak 26.4.7.
          image: quay.io/keycloak/keycloak:26.4.7@sha256:9409c59bdfb65dbffa20b11e6f18b8abb9281d480c7ca402f51ed3d5977e6007
          imagePullPolicy: IfNotPresent
          args: ["start-dev", "--import-realm"]
          env:
            # Keycloak defaults to a 70% max heap, which left too little native
            # headroom during Quarkus augmentation under the former 768 MiB CI
            # limit. Keep a deterministic 512 MiB heap and equal non-heap room.
            - name: JAVA_OPTS_KC_HEAP
              value: -Xms128m -Xmx512m
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: stage-five-local-admin
            - name: KC_HOSTNAME
              value: http://keycloak.kube-mcp.svc.cluster.local:8080
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /realms/kube-mcp
              port: http
            initialDelaySeconds: 10
            periodSeconds: 3
            failureThreshold: 40
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: kube-mcp-keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: kube-mcp
spec:
  selector:
    app.kubernetes.io/name: kube-mcp-keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
