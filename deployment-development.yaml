# Development-only deployment overlay for kube-mcp.
#
# This manifest runs the service with AuthenticationMode=None behind the
# deliberate KubeMcp:Authentication:AllowUnauthenticated opt-in. The MCP
# endpoint is reachable WITHOUT credentials. Use this ONLY on a trusted local
# or development network. Never expose it to a shared or production network.
#
# For any non-development deployment, use deployment.yaml, which is fail-closed
# and requires OAuth (or API-key) credentials. See README for details.
#
# Apply after deployment.yaml to override the production authentication settings,
# for example:
#   kubectl apply --filename deployment.yaml
#   kubectl apply --filename deployment-development.yaml
#
# To return to the authenticated reference deployment, reapply deployment.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-mcp
  namespace: kube-mcp
  labels:
    app.kubernetes.io/name: kube-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-mcp
    spec:
      serviceAccountName: kube-mcp
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-mcp
          image: ghcr.io/jghh42/kube-mcp:latest
          imagePullPolicy: Always
          env:
            - name: DOTNET_ENVIRONMENT
              value: Development
            # DEVELOPMENT ONLY: unauthenticated mode is selected only in this
            # explicitly named overlay and retains the deliberate opt-in.
            - name: KubeMcp__Authentication__Mode
              value: None
            - name: KubeMcp__Authentication__AllowUnauthenticated
              value: "true"
            - name: KubeMcp__SecretHmacKey
              valueFrom:
                secretKeyRef:
                  name: kube-mcp-hmac
                  key: key
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              httpHeaders:
                - name: Host
                  value: kube-mcp
            initialDelaySeconds: 2
            periodSeconds: 5
            # Must exceed the application's internal 2s Kubernetes readiness deadline.
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: kube-mcp
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
