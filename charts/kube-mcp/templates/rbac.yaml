{{- $presets := .Files.Get "files/crd-presets.yaml" | fromYaml }}
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kube-mcp.clusterRoleName" . }}
  labels:
    {{- include "kube-mcp.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - endpoints
      - configmaps
      - secrets
      - events
      - persistentvolumeclaims
      - replicationcontrollers
      - limitranges
      - resourcequotas
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list"]
  {{- range $family, $enabled := .Values.crds }}
  {{- if $enabled }}
  {{- $preset := index $presets $family }}
  - apiGroups: [{{ $preset.group | quote }}]
    resources:
      {{- range $resource, $_ := $preset.resources }}
      - {{ $resource }}
      {{- end }}
    verbs: ["get", "list"]
  {{- end }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kube-mcp.clusterRoleName" . }}
  labels:
    {{- include "kube-mcp.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kube-mcp.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kube-mcp.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
