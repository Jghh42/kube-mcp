name: Build, test, and publish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  # Release tags are serialized because they share floating container tags such
  # as 1.2. Branch and pull-request runs retain per-ref cancellation.
  group: container-${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/v') && 'release-tags' || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

# Third-party actions, downloaded tools, and Docker base images are pinned.
# NuGet restore is locked. The container job builds one linux/amd64 image,
# exercises it against a real Kubernetes/Secret boundary, scans and SBOMs that
# same local image, and only then publishes it with provenance and SBOM
# attestations. Release-tag chart publication waits for that job. Pull requests
# exercise the same Helm OCI push command against an ephemeral local registry.
permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      # actions/checkout v5.1.0
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # actions/setup-dotnet v5.4.0
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Restore dependencies (locked)
        run: dotnet restore KubeMcp.slnx --locked-mode

      - name: Build
        run: dotnet build KubeMcp.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test KubeMcp.slnx --configuration Release --no-build --no-restore

      - name: Check patch whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            git diff --check "$BASE_SHA"...HEAD
          elif [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BEFORE_SHA" HEAD
          else
            git show --check --format= HEAD
          fi

      - name: Install pinned Helm
        run: |
          set -euo pipefail
          curl -fsSLO https://get.helm.sh/helm-v3.21.3-linux-amd64.tar.gz
          echo "15e041a93a590dce8100f39385cd98c84a765c9e36aeeb9e2dc6ff9e4769e2e0  helm-v3.21.3-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf helm-v3.21.3-linux-amd64.tar.gz
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: Validate Helm chart
        run: tests/helm/run.sh

      - name: Smoke-test Helm OCI push
        run: tests/helm/push-oci.sh

      - name: Validate release chart version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${VERSION#v}
          [[ "$version" =~ ^[0-9A-Za-z.+-]+$ && "$version" == "${version,,}" ]] || {
            echo "::error::Chart version must contain only lowercase SemVer characters: $version"
            exit 1
          }
          helm package charts/kube-mcp \
            --version "$version" \
            --app-version "$version" \
            --destination /tmp

      - name: Scan NuGet dependencies for known vulnerabilities
        run: |
          set -euo pipefail
          dotnet list KubeMcp.slnx package --no-restore --vulnerable --include-transitive --format json > vuln-scan.json
          python3 - <<'PY'
          import json
          import sys

          data = json.load(open("vuln-scan.json"))
          vulnerabilities = []

          def walk(value):
              if isinstance(value, dict):
                  if "severity" in value:
                      vulnerabilities.append(value)
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)

          walk(data)
          if vulnerabilities:
              for vulnerability in vulnerabilities:
                  print(
                      "::error::Known NuGet vulnerability: "
                      f"severity={vulnerability.get('severity', '?')} "
                      f"url={vulnerability.get('url', '')}"
                  )
              sys.exit(1)
          print("No known vulnerable NuGet packages found.")
          PY

      # Pull requests run the real container/Kubernetes boundary with a
      # read-only job token. Publication credentials exist only in the
      # push-only job below.
      - name: Install pinned kind and kubectl for pull request
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          curl -fsSLo kind https://github.com/kubernetes-sigs/kind/releases/download/v0.27.0/kind-linux-amd64
          echo "a6875aaea358acf0ac07786b1a6755d08fd640f4c79b7a2e46681cc13f49a04b  kind" | sha256sum -c -
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          curl -fsSLo kubectl https://dl.k8s.io/release/v1.32.2/bin/linux/amd64/kubectl
          echo "4f6a959dcc5b702135f8354cc7109b542a2933c46b808b248a214c1f69f817ea  kubectl" | sha256sum -c -
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kind version
          kubectl version --client=true
          kubectl kustomize --load-restrictor LoadRestrictionsNone overlays/development >/dev/null

      - name: Build pull-request candidate image
        if: github.event_name == 'pull_request'
        env:
          DOCKER_BUILDKIT: 1
        run: |
          docker build --platform linux/amd64 --tag kube-mcp:integration .
          [[ $(docker image inspect --format '{{.Os}}/{{.Architecture}}' kube-mcp:integration) == linux/amd64 ]]

      - name: Test pull-request candidate in disposable kind
        if: github.event_name == 'pull_request'
        env:
          KUBE_MCP_SKIP_IMAGE_BUILD: true
        run: tests/integration/run-kind.sh

      # aquasecurity/trivy-action v0.36.0
      - name: Scan pull-request candidate image
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: kube-mcp:integration
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  container-kind-scan-publish:
    name: Container, kind, scan, and publish
    if: github.event_name == 'push'
    needs: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    steps:
      # actions/checkout v5.1.0
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/setup-dotnet v5.4.0
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Install pinned kind and kubectl
        run: |
          set -euo pipefail
          curl -fsSLo kind https://github.com/kubernetes-sigs/kind/releases/download/v0.27.0/kind-linux-amd64
          echo "a6875aaea358acf0ac07786b1a6755d08fd640f4c79b7a2e46681cc13f49a04b  kind" | sha256sum -c -
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          curl -fsSLo kubectl https://dl.k8s.io/release/v1.32.2/bin/linux/amd64/kubectl
          echo "4f6a959dcc5b702135f8354cc7109b542a2933c46b808b248a214c1f69f817ea  kubectl" | sha256sum -c -
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kind version
          kubectl version --client=true
          kubectl kustomize --load-restrictor LoadRestrictionsNone overlays/development >/dev/null

      # Build once. Do not add arm64 publication without exercising arm64 in kind.
      - name: Build candidate image
        env:
          DOCKER_BUILDKIT: 1
        run: |
          docker build --platform linux/amd64 \
            --tag kube-mcp:integration \
            --label org.opencontainers.image.title=kube-mcp \
            --label 'org.opencontainers.image.description=Tiny read-only Kubernetes MCP service' \
            --label org.opencontainers.image.source=https://github.com/Jghh42/kube-mcp \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            .
          [[ $(docker image inspect --format '{{.Os}}/{{.Architecture}}' kube-mcp:integration) == linux/amd64 ]]

      - name: Test candidate in disposable kind cluster
        env:
          KUBE_MCP_SKIP_IMAGE_BUILD: true
        run: tests/integration/run-kind.sh

      # aquasecurity/trivy-action v0.36.0
      - name: Scan tested image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: kube-mcp:integration
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy-results.sarif

      # aquasecurity/trivy-action v0.36.0
      - name: Generate image SBOM
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: kube-mcp:integration
          format: cyclonedx
          output: sbom.cdx.json

      # docker/metadata-action v6.2.0
      - name: Generate image metadata
        if: github.event_name == 'push'
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/jghh42/kube-mcp
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      # docker/login-action v4.6.0
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested and scanned image
        if: github.event_name == 'push'
        id: publish
        env:
          PUBLISH_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          set -euo pipefail
          digest=
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            [[ "$tag" == ghcr.io/jghh42/kube-mcp:* ]] || {
              echo "::error::Refusing unexpected publication tag: $tag"
              exit 1
            }
            docker tag kube-mcp:integration "$tag"
            push_output=$(docker push "$tag" 2>&1)
            printf '%s\n' "$push_output"
            pushed_digest=$(awk '{for (i=1; i<=NF; i++) if ($i == "digest:") print $(i+1)}' \
              <<<"$push_output" | tail -1)
            [[ "$pushed_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "::error::Docker did not report a valid digest for $tag"
              exit 1
            }
            if [[ -n "$digest" && "$pushed_digest" != "$digest" ]]; then
              echo "::error::Published tags did not identify the same tested image"
              exit 1
            fi
            digest=$pushed_digest
          done <<<"$PUBLISH_TAGS"
          [[ -n "$digest" ]] || {
            echo "::error::No image tags were provided for publication"
            exit 1
          }
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          echo "Published immutable image: ghcr.io/jghh42/kube-mcp@$digest" >>"$GITHUB_STEP_SUMMARY"

      # actions/attest-build-provenance v4.2.2
      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ghcr.io/jghh42/kube-mcp
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      # actions/attest v4.1.0
      - name: Attest SBOM
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/jghh42/kube-mcp
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

      # github/codeql-action v3.37.8
      - name: Upload Trivy SARIF
        if: always() && github.event_name == 'push' && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

  publish-helm-release:
    name: Publish release Helm chart
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: container-kind-scan-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      # actions/checkout v5.1.0
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pinned Helm
        run: |
          set -euo pipefail
          curl -fsSLO https://get.helm.sh/helm-v3.21.3-linux-amd64.tar.gz
          echo "15e041a93a590dce8100f39385cd98c84a765c9e36aeeb9e2dc6ff9e4769e2e0  helm-v3.21.3-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf helm-v3.21.3-linux-amd64.tar.gz
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: Package release chart
        id: package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${VERSION#v}
          [[ "$version" =~ ^[0-9A-Za-z.+-]+$ && "$version" == "${version,,}" ]] || {
            echo "::error::Chart version must contain only lowercase SemVer characters: $version"
            exit 1
          }
          mkdir -p dist
          helm package charts/kube-mcp \
            --version "$version" \
            --app-version "$version" \
            --destination dist
          test -f "dist/kube-mcp-${version}.tgz"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io \
            --username '${{ github.actor }}' \
            --password-stdin

      - name: Publish chart
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          reference="oci://ghcr.io/jghh42/charts/kube-mcp"
          if existing=$(helm show chart "$reference" --version "$VERSION" 2>&1); then
            echo "::error::Chart version $VERSION already exists at $reference"
            exit 1
          elif ! grep -Eqi 'not found|manifest unknown' <<<"$existing"; then
            echo "::error::Could not verify that chart version $VERSION is absent"
            exit 1
          fi
          if ! output=$(helm push "dist/kube-mcp-${VERSION}.tgz" oci://ghcr.io/jghh42/charts 2>&1); then
            echo "::error::Helm chart publication failed"
            exit 1
          fi
          digest=$(awk '/^Digest: sha256:/ {print $2}' <<<"$output" | tail -1)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Helm did not report a valid chart digest"
            exit 1
          }
          oci_version=${VERSION//+/_}
          echo "Published chart digest: $digest"
          echo "Published chart: ghcr.io/jghh42/charts/kube-mcp:$oci_version" >>"$GITHUB_STEP_SUMMARY"
          echo "Chart digest: $digest" >>"$GITHUB_STEP_SUMMARY"
