version: 2
updates:
  # Keep project files and their committed packages.lock.json files in one
  # reviewed update so locked CI/Docker restores remain reproducible.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # Refresh digest-pinned Dockerfile dependencies without reverting to mutable
  # tags. The human-readable tag remains visible beside each digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The project targets .NET 10 (global.json and TargetFramework). Moving
      # to a new .NET major is a deliberate migration, not an image bump.
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]

  # Full action SHAs are mandatory; automated update PRs avoid requiring
  # mutable major-version tags in the workflow itself.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
